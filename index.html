<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タグるんです</title>
<style>
  :root {
    --bg: #0F1117;
    --surface: #1A1D27;
    --surface2: #22263A;
    --border: #2E3352;
    --amber: #F59E0B;
    --amber-dim: #78490B;
    --text: #F0F2FF;
    --text-dim: #7B82A8;
    --red: #EF4444;
    --green: #22C55E;
    --radius: 12px;
    --font: 'Helvetica Neue', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--amber); }

  /* ── Nav tabs ── */
  nav {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: 8px;
    padding: 4px;
  }
  nav button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  nav button.active {
    background: var(--amber);
    color: #000;
  }

  /* ── Main screens ── */
  main { flex: 1; padding: 20px; max-width: 680px; margin: 0 auto; width: 100%; }

  .screen { display: none; }
  .screen.visible { display: block; }

  /* ── Section headers ── */
  .sec-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  /* ── Tag grid ── */
  .tag-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tag-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .tag-chip:hover { border-color: var(--amber); }
  .tag-chip.selected {
    border-color: var(--amber);
    background: var(--amber-dim);
    color: var(--amber);
  }
  .tag-chip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.7;
  }
  .tag-count {
    font-size: 11px;
    opacity: 0.6;
    margin-left: 2px;
  }

  /* ── Add tag ── */
  .add-tag-row {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  .add-tag-row input {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .add-tag-row input:focus { border-color: var(--amber); }
  .add-tag-row input::placeholder { color: var(--text-dim); }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn-amber { background: var(--amber); color: #000; }
  .btn-amber:hover { background: #FBBF24; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
  .btn-ghost:hover { border-color: var(--amber); }

  /* ── Camera area ── */
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }
  #preview {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .camera-placeholder {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .camera-placeholder svg { opacity: 0.4; }

  .shutter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
  }
  .shutter-btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 3px solid var(--amber);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .shutter-btn:hover { background: rgba(245,158,11,0.15); }
  .shutter-btn:active { transform: scale(0.95); }
  .shutter-inner {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--amber);
  }

  .selected-tag-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--amber-dim);
    color: var(--amber);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .no-tag-warning {
    color: var(--red);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  /* hidden canvas for capture */
  #canvas { display: none; }

  /* ── Album list ── */
  .album-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .album-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .album-card:hover { border-color: var(--amber); transform: translateY(-2px); }
  .album-thumb {
    width: 100%; aspect-ratio: 4/3;
    object-fit: cover;
    background: var(--surface2);
    display: block;
  }
  .album-thumb-empty {
    width: 100%; aspect-ratio: 4/3;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 28px;
  }
  .album-info {
    padding: 10px 12px;
  }
  .album-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .album-meta {
    font-size: 11px;
    color: var(--text-dim);
  }

  .empty-state {
    text-align: center;
    padding: 60px 0;
    color: var(--text-dim);
  }
  .empty-state p { margin-top: 12px; font-size: 14px; }

  /* ── Photo viewer ── */
  #viewer-screen { display: none; }
  #viewer-screen.visible { display: block; }

  .viewer-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .back-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.15s;
  }
  .back-btn:hover { border-color: var(--amber); }
  .viewer-title { font-size: 18px; font-weight: 700; }
  .photo-count { font-size: 13px; color: var(--text-dim); margin-left: auto; }

  /* View toggle */
  .view-toggle {
    display: flex;
    background: var(--surface2);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 16px;
    width: fit-content;
  }
  .view-toggle button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .view-toggle button.active {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* Timeline view */
  .timeline { display: flex; flex-direction: column; gap: 16px; }
  .timeline-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .timeline-item:hover { border-color: var(--border); }
  .timeline-photo {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
  }
  .timeline-meta {
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .timeline-date { font-size: 13px; color: var(--text-dim); }
  .delete-photo-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .delete-photo-btn:hover { color: var(--red); }

  /* Compare view */
  .compare-view {
    display: none;
  }
  .compare-view.active { display: block; }
  .compare-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .compare-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .compare-strip::-webkit-scrollbar { height: 4px; }
  .compare-strip::-webkit-scrollbar-track { background: transparent; }
  .compare-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .compare-card {
    flex: 0 0 200px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .compare-card img {
    width: 100%; height: 150px;
    object-fit: cover;
    display: block;
  }
  .compare-card-date {
    padding: 8px 10px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  .timeline-view { display: none; }
  .timeline-view.active { display: flex; flex-direction: column; gap: 16px; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #000;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 100px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    animation: modal-in 0.18s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes modal-in {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  .modal-icon { font-size: 32px; margin-bottom: 12px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .modal-body  { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 20px; }
  .modal-body strong { color: var(--text); }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions .btn { flex: 1; text-align: center; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: #f87171; }

  /* move-tag list inside modal */
  .move-tag-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
  .move-tag-option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.15s, background 0.15s;
  }
  .move-tag-option:hover { border-color: var(--amber); background: var(--amber-dim); color: var(--amber); }
  .move-tag-option .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* tag-chip delete button */
  .tag-chip-del {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 14px; line-height: 1;
    padding: 0 0 0 2px; opacity: 0.6;
    transition: opacity 0.15s, color 0.15s;
  }
  .tag-chip-del:hover { opacity: 1; color: var(--red); }

  /* tag-chip edit button */
  .tag-chip-edit {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 13px; line-height: 1;
    padding: 0 2px; opacity: 0.6;
    transition: opacity 0.15s, color 0.15s;
  }
  .tag-chip-edit:hover { opacity: 1; color: var(--amber); }

  /* drag handle → sort handle */
  .tag-chip-handle {
    cursor: pointer; color: var(--text-dim); font-size: 14px;
    padding: 0 4px 0 0; opacity: 0.4; line-height: 1;
    user-select: none; touch-action: manipulation;
    transition: opacity 0.15s;
  }
  .tag-chip-handle:hover { opacity: 0.9; }

  /* sort mode */
  .tag-grid.sort-mode .tag-chip { border-color: var(--amber-dim); }
  .tag-chip.sort-active {
    border-color: var(--amber) !important;
    background: var(--amber-dim) !important;
    color: var(--amber) !important;
  }
  .sort-mode-bar {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1.5px solid var(--amber);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--amber);
  }
  .sort-mode-bar.visible { display: flex; }
  .sort-mode-bar span { flex: 1; }
  .sort-btn {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 18px;
    width: 38px; height: 38px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .sort-btn:hover { border-color: var(--amber); background: var(--amber-dim); color: var(--amber); }
  .sort-btn:disabled { opacity: 0.25; pointer-events: none; }

  /* edit-tag modal input */
  .modal-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: var(--amber); }

  /* move button on photo */
  .move-photo-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 2px 6px;
    border-radius: 4px; transition: color 0.15s;
  }
  .move-photo-btn:hover { color: var(--amber); }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="switchTab('shoot')" style="cursor:pointer">タグ<span>るんです</span></div>
  <nav>
    <button class="active" onclick="switchTab('shoot')">📷 撮影</button>
    <button onclick="switchTab('albums')">🗂 アルバム</button>
  </nav>
</header>

<!-- backup banner (shown when localStorage unavailable) -->
<div id="backup-banner" style="display:none;background:#78490B;color:#FDE68A;font-size:12px;padding:8px 16px;text-align:center;line-height:1.6">
  ⚠ このブラウザでは自動保存できません。アプリを閉じる前に <strong>「データを保存」</strong> を押してください。
</div>

<input type="file" id="import-input" accept=".json" style="display:none">

<main id="main-content">

  <!-- SHOOT SCREEN -->
  <div class="screen visible" id="shoot-screen">

    <div class="sec-title" style="margin-bottom:10px;">タグを選択</div>
    <div class="tag-grid" id="tag-grid"></div>

    <div class="add-tag-row">
      <input type="text" id="new-tag-input" placeholder="新しいタグを追加..." maxlength="20" onkeydown="if(event.key==='Enter') addTag()">
      <button class="btn btn-ghost" onclick="addTag()">追加</button>
    </div>

    <div class="sec-title">撮影</div>
    <div id="selected-tag-display"></div>
    <div class="no-tag-warning" id="no-tag-warn">⚠ タグを選択してください</div>

    <div class="camera-wrap" id="camera-wrap">
      <video id="preview" autoplay playsinline muted></video>
      <div class="camera-placeholder" id="cam-placeholder">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>カメラを起動してください</span>
      </div>
    </div>
    <canvas id="canvas"></canvas>

    <div class="shutter-row">
      <button class="btn btn-ghost" id="start-cam-btn" onclick="startCamera()">📷 カメラ起動</button>
      <button class="shutter-btn" onclick="capturePhoto()" id="shutter-btn" style="display:none">
        <div class="shutter-inner"></div>
      </button>
      <button class="btn btn-ghost" id="stop-cam-btn" onclick="stopCamera()" style="display:none">停止</button>
    </div>

    <div style="text-align:center;margin-top:-8px;margin-bottom:4px">
      <button class="btn btn-ghost" onclick="pickFromLibrary()" style="width:100%;justify-content:center;display:flex;align-items:center;gap:8px">
        🖼 写真ライブラリから追加
      </button>
    </div>
    <input type="file" id="library-input" accept="image/*" multiple style="display:none">

  </div>

  <!-- ALBUMS SCREEN -->
  <div class="screen" id="albums-screen">
    <div class="sec-title" style="margin-bottom:16px;">アルバム一覧</div>
    <div id="album-grid" class="album-grid"></div>
    <div class="empty-state" id="album-empty" style="display:none">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" opacity="0.4">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      <p>まだ写真がありません。<br>タグを選んで撮影してみましょう。</p>
    </div>

    <!-- backup / restore -->
    <div style="margin-top:32px;display:flex;flex-direction:column;gap:8px">
      <div class="sec-title">データ管理</div>
      <button class="btn btn-ghost" onclick="exportData()" style="width:100%;justify-content:center;display:flex;gap:8px">💾 データを保存（バックアップ）</button>
      <button class="btn btn-ghost" onclick="document.getElementById('import-input').click()" style="width:100%;justify-content:center;display:flex;gap:8px">📂 データを読み込む（復元）</button>
    </div>
  </div>

</main>

<!-- VIEWER (outside main) -->
<div id="viewer-screen" style="padding:20px; max-width:680px; margin:0 auto;">
  <div class="viewer-header">
    <button class="back-btn" onclick="closeViewer()">← 戻る</button>
    <div class="viewer-title" id="viewer-tag-name"></div>
    <div class="photo-count" id="viewer-photo-count"></div>
  </div>

  <div class="view-toggle">
    <button class="active" id="btn-timeline" onclick="setView('timeline')">📅 日付順</button>
    <button id="btn-compare" onclick="setView('compare')">⬛⬛ 見比べ</button>
  </div>

  <!-- Timeline -->
  <div class="timeline-view active" id="timeline-view"></div>

  <!-- Compare -->
  <div class="compare-view" id="compare-view">
    <div class="compare-label">最新の写真（新しい順）</div>
    <div class="compare-strip" id="compare-strip"></div>
  </div>
</div>

<!-- sort mode bar -->
<div class="sort-mode-bar" id="sort-mode-bar">
  <span>タグを選んで ↑↓ で移動</span>
  <button class="sort-btn" id="sort-up-btn" onclick="sortMove(-1)" title="上へ">↑</button>
  <button class="sort-btn" id="sort-down-btn" onclick="sortMove(1)" title="下へ">↓</button>
  <button class="btn btn-amber" style="padding:8px 14px;font-size:13px" onclick="exitSortMode()">完了</button>
</div>

<!-- EDIT TAG MODAL -->
<div class="modal-overlay" id="modal-edit-tag">
  <div class="modal">
    <div class="modal-icon">✏️</div>
    <div class="modal-title">タグ名を変更</div>
    <input class="modal-input" id="edit-tag-input" maxlength="20" placeholder="新しいタグ名">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-edit-tag')">キャンセル</button>
      <button class="btn btn-amber" id="modal-edit-confirm">変更する</button>
    </div>
  </div>
</div>

<!-- TAG DELETE MODAL -->
<div class="modal-overlay" id="modal-delete-tag">
  <div class="modal">
    <div class="modal-icon">🗑️</div>
    <div class="modal-title" id="modal-del-title">タグを削除しますか？</div>
    <div class="modal-body" id="modal-del-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-delete-tag')">キャンセル</button>
      <button class="btn btn-red" id="modal-del-confirm">削除する</button>
    </div>
  </div>
</div>

<!-- PHOTO DELETE MODAL -->
<div class="modal-overlay" id="modal-delete-photo">
  <div class="modal">
    <div class="modal-icon">🗑️</div>
    <div class="modal-title">この写真を削除しますか？</div>
    <div class="modal-body">削除した写真は元に戻せません。</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-delete-photo')">キャンセル</button>
      <button class="btn btn-red" id="modal-del-photo-confirm">削除する</button>
    </div>
  </div>
</div>

<!-- MOVE PHOTO MODAL -->
<div class="modal-overlay" id="modal-move-photo">
  <div class="modal">
    <div class="modal-icon">📂</div>
    <div class="modal-title">タグを変更</div>
    <div class="modal-body">移動先のタグを選んでください。</div>
    <div class="move-tag-list" id="move-tag-list"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="width:100%" onclick="closeModal('modal-move-photo')">キャンセル</button>
    </div>
  </div>
</div>

<div id="toast">📸 写真を保存しました</div>

<script>
// ── State ──
const UNTAGGED_ID = '__untagged__';
const DEFAULT_TAGS = ['体重記録', 'スキンケア', '筋トレ', '食事'];
const TAG_COLORS = ['#F59E0B','#3B82F6','#22C55E','#EC4899','#8B5CF6','#F97316','#14B8A6','#EF4444'];

let state = {
  tags: [],          // [{id, name, color}]
  photos: {},        // { tagId: [{id, dataUrl, date}] }
  selectedTag: null,
  currentAlbum: null,
  currentView: 'timeline',
  stream: null,
};

// ── Persist ──
let _localStorageAvailable = false;

function checkLocalStorage() {
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    _localStorageAvailable = true;
  } catch(e) {
    _localStorageAvailable = false;
    document.getElementById('backup-banner').style.display = 'block';
  }
}

function save() {
  if (!_localStorageAvailable) return;
  try {
    localStorage.setItem('tagshot_tags', JSON.stringify(state.tags));
    localStorage.setItem('tagshot_photos', JSON.stringify(state.photos));
  } catch(e) {
    // Storage full
    _localStorageAvailable = false;
    document.getElementById('backup-banner').style.display = 'block';
  }
}

function load() {
  if (!_localStorageAvailable) return;
  try {
    const tags = localStorage.getItem('tagshot_tags');
    const photos = localStorage.getItem('tagshot_photos');
    if (tags) state.tags = JSON.parse(tags);
    if (photos) state.photos = JSON.parse(photos);
  } catch(e) {}
  if (state.tags.length === 0) {
    DEFAULT_TAGS.forEach((name, i) => addTagData(name, i));
  }
}

// ── Export / Import ──
function exportData() {
  const data = JSON.stringify({ tags: state.tags, photos: state.photos });
  const blob = new Blob([data], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `タグるんです_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 データを保存しました');
}

document.getElementById('import-input').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (r) => {
    try {
      const data = JSON.parse(r.target.result);
      if (!data.tags || !data.photos) throw new Error();
      state.tags   = data.tags;
      state.photos = data.photos;
      save();
      renderTagGrid();
      renderAlbums();
      showToast('📂 データを復元しました');
    } catch(e) {
      showToast('❌ ファイルが正しくありません');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
});

function addTagData(name, colorIdx) {
  const id = 'tag_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const color = TAG_COLORS[colorIdx % TAG_COLORS.length];
  state.tags.push({ id, name, color });
  if (!state.photos[id]) state.photos[id] = [];
}

// ── Tab switching ──
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('visible'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('viewer-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';

  if (tab === 'shoot') {
    document.getElementById('shoot-screen').classList.add('visible');
    document.querySelectorAll('nav button')[0].classList.add('active');
    renderTagGrid();
  } else {
    document.getElementById('albums-screen').classList.add('visible');
    document.querySelectorAll('nav button')[1].classList.add('active');
    renderAlbums();
  }
}

// ── Tag grid ──
let _sortMode = false;
let _sortActiveId = null;
let _longPressTimer = null;

function renderTagGrid() {
  const grid = document.getElementById('tag-grid');
  grid.innerHTML = '';
  grid.classList.toggle('sort-mode', _sortMode);

  state.tags.filter(t => t.id !== UNTAGGED_ID).forEach(tag => {
    const count = (state.photos[tag.id] || []).length;
    const chip = document.createElement('div');
    const isActive = _sortMode && _sortActiveId === tag.id;
    chip.className = 'tag-chip' + (!_sortMode && state.selectedTag === tag.id ? ' selected' : '') + (isActive ? ' sort-active' : '');
    chip.dataset.tagId = tag.id;
    chip.innerHTML = `
      <span class="tag-chip-handle" title="長押しで並び替え">⠿</span>
      <span class="dot" style="background:${tag.color}"></span>
      <span class="tag-label" style="flex:1;cursor:pointer">${tag.name}<span class="tag-count" style="margin-left:4px">${count}</span></span>
      <button class="tag-chip-edit" title="タグ名を編集">✏️</button>
      <button class="tag-chip-del" title="タグを削除">✕</button>
    `;

    const handle = chip.querySelector('.tag-chip-handle');
    const label  = chip.querySelector('.tag-label');
    const editBtn = chip.querySelector('.tag-chip-edit');
    const delBtn  = chip.querySelector('.tag-chip-del');

    // Long press on handle → enter sort mode and select this tag
    handle.addEventListener('touchstart', (e) => {
      _longPressTimer = setTimeout(() => {
        navigator.vibrate && navigator.vibrate(30);
        enterSortMode(tag.id);
      }, 400);
    }, { passive: true });
    handle.addEventListener('touchend', () => clearTimeout(_longPressTimer));
    handle.addEventListener('touchmove', () => clearTimeout(_longPressTimer), { passive: true });

    // In sort mode: tapping label selects for reorder
    label.addEventListener('click', () => {
      if (_sortMode) { selectSortTag(tag.id); }
      else { selectTag(tag.id); }
    });

    editBtn.addEventListener('click', (e) => { e.stopPropagation(); if (!_sortMode) openEditTag(tag.id); });
    delBtn.addEventListener('click',  (e) => { e.stopPropagation(); if (!_sortMode) confirmDeleteTag(e, tag.id); });

    grid.appendChild(chip);
  });

  // Sort mode bar
  const bar = document.getElementById('sort-mode-bar');
  if (_sortMode) {
    bar.classList.add('visible');
    updateSortButtons();
    // move bar just before tag-grid
    const section = grid.parentElement;
    section.insertBefore(bar, grid);
  } else {
    bar.classList.remove('visible');
    updateSelectedBadge();
  }
}

function selectTag(id) {
  state.selectedTag = (state.selectedTag === id) ? null : id;
  renderTagGrid();
}

function updateSelectedBadge() {
  const el = document.getElementById('selected-tag-display');
  if (state.selectedTag) {
    const tag = state.tags.find(t => t.id === state.selectedTag);
    el.innerHTML = `<div class="selected-tag-badge"><span style="width:8px;height:8px;border-radius:50%;background:${tag.color};display:inline-block"></span>${tag.name} に保存</div>`;
  } else {
    el.innerHTML = '';
  }
}

function addTag() {
  const input = document.getElementById('new-tag-input');
  const name = input.value.trim();
  if (!name) return;
  if (state.tags.find(t => t.name === name)) {
    input.value = '';
    return;
  }
  addTagData(name, state.tags.length);
  save();
  input.value = '';
  renderTagGrid();
}

// ── Camera ──
async function startCamera() {
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    const video = document.getElementById('preview');
    video.srcObject = state.stream;
    document.getElementById('cam-placeholder').style.display = 'none';
    document.getElementById('start-cam-btn').style.display = 'none';
    document.getElementById('shutter-btn').style.display = 'flex';
    document.getElementById('stop-cam-btn').style.display = 'inline-flex';
  } catch(e) {
    // Fallback: use file input
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.onchange = (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (r) => savePhotoFromDataUrl(r.target.result);
      reader.readAsDataURL(file);
    };
    input.click();
  }
}

function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
  const video = document.getElementById('preview');
  video.srcObject = null;
  document.getElementById('cam-placeholder').style.display = 'flex';
  document.getElementById('start-cam-btn').style.display = 'inline-flex';
  document.getElementById('shutter-btn').style.display = 'none';
  document.getElementById('stop-cam-btn').style.display = 'none';
}

function capturePhoto() {
  if (!state.selectedTag) {
    document.getElementById('no-tag-warn').style.display = 'block';
    setTimeout(() => document.getElementById('no-tag-warn').style.display = 'none', 2000);
    return;
  }
  const video = document.getElementById('preview');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  savePhotoFromDataUrl(dataUrl);
}

function savePhotoFromDataUrl(dataUrl) {
  if (!state.selectedTag) {
    document.getElementById('no-tag-warn').style.display = 'block';
    setTimeout(() => document.getElementById('no-tag-warn').style.display = 'none', 2000);
    return;
  }
  const photo = {
    id: 'p_' + Date.now(),
    dataUrl,
    date: new Date().toISOString(),
  };
  if (!state.photos[state.selectedTag]) state.photos[state.selectedTag] = [];
  state.photos[state.selectedTag].unshift(photo);
  save();
  renderTagGrid();
  showToast('📸 写真を保存しました');
}

// ── Library import ──
function pickFromLibrary() {
  if (!state.selectedTag) {
    document.getElementById('no-tag-warn').style.display = 'block';
    setTimeout(() => document.getElementById('no-tag-warn').style.display = 'none', 2000);
    return;
  }
  const input = document.getElementById('library-input');
  input.value = '';
  input.click();
}

document.getElementById('library-input').addEventListener('change', (ev) => {
  const files = [...ev.target.files];
  if (!files.length) return;
  if (!state.selectedTag) {
    document.getElementById('no-tag-warn').style.display = 'block';
    setTimeout(() => document.getElementById('no-tag-warn').style.display = 'none', 2000);
    return;
  }
  let loaded = 0;
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = (r) => {
      const photo = {
        id: 'p_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2),
        dataUrl: r.target.result,
        date: file.lastModified ? new Date(file.lastModified).toISOString() : new Date().toISOString(),
      };
      if (!state.photos[state.selectedTag]) state.photos[state.selectedTag] = [];
      state.photos[state.selectedTag].unshift(photo);
      loaded++;
      if (loaded === files.length) {
        save();
        renderTagGrid();
        renderAlbums();
        showToast(`🖼 ${files.length}枚を追加しました`);
      }
    };
    reader.readAsDataURL(file);
  });
});

// ── Albums ──
function renderAlbums() {
  const grid = document.getElementById('album-grid');
  const empty = document.getElementById('album-empty');
  grid.innerHTML = '';

  // Include untagged if it has photos but isn't in tags list yet (shouldn't happen, but safe)
  const allTagIds = new Set(state.tags.map(t => t.id));
  if ((state.photos[UNTAGGED_ID] || []).length > 0 && !allTagIds.has(UNTAGGED_ID)) {
    state.tags.push({ id: UNTAGGED_ID, name: 'タグなし', color: '#7B82A8' });
  }

  const tagsWithPhotos = state.tags.filter(t => (state.photos[t.id] || []).length > 0);
  if (tagsWithPhotos.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tagsWithPhotos.forEach(tag => {
    const photos = state.photos[tag.id] || [];
    const card = document.createElement('div');
    card.className = 'album-card';
    card.onclick = () => openViewer(tag.id);

    const thumb = photos[0];
    const thumbHTML = thumb
      ? `<img class="album-thumb" src="${thumb.dataUrl}" alt="">`
      : `<div class="album-thumb-empty">📷</div>`;

    const latest = photos[0] ? formatDate(photos[0].date) : '';
    card.innerHTML = `
      ${thumbHTML}
      <div class="album-info">
        <div class="album-name" style="color:${tag.color}">${tag.name}</div>
        <div class="album-meta">${photos.length}枚 · ${latest}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ── Viewer ──
function openViewer(tagId) {
  state.currentAlbum = tagId;
  state.currentView = 'timeline';
  document.getElementById('main-content').style.display = 'none';
  const viewer = document.getElementById('viewer-screen');
  viewer.style.display = 'block';

  const tag = state.tags.find(t => t.id === tagId);
  const photos = state.photos[tagId] || [];

  document.getElementById('viewer-tag-name').textContent = tag.name;
  document.getElementById('viewer-tag-name').style.color = tag.color;
  document.getElementById('viewer-photo-count').textContent = `${photos.length}枚`;

  setView('timeline');
}

function closeViewer() {
  document.getElementById('viewer-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  state.currentAlbum = null;
  renderAlbums();
}

function setView(v) {
  state.currentView = v;
  document.getElementById('btn-timeline').classList.toggle('active', v === 'timeline');
  document.getElementById('btn-compare').classList.toggle('active', v === 'compare');
  document.getElementById('timeline-view').classList.toggle('active', v === 'timeline');
  document.getElementById('compare-view').classList.toggle('active', v === 'compare');

  const photos = state.photos[state.currentAlbum] || [];

  if (v === 'timeline') {
    renderTimeline(photos);
  } else {
    renderCompare(photos);
  }
}

function renderTimeline(photos) {
  const el = document.getElementById('timeline-view');
  el.innerHTML = '';
  if (photos.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>写真がありません。</p></div>';
    return;
  }
  // Sort newest first for timeline
  const sorted = [...photos].sort((a,b) => new Date(b.date) - new Date(a.date));
  sorted.forEach(photo => {
    const item = document.createElement('div');
    item.className = 'timeline-item';
    item.innerHTML = `
      <img class="timeline-photo" src="${photo.dataUrl}" alt="">
      <div class="timeline-meta">
        <span class="timeline-date">${formatDateFull(photo.date)}</span>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="move-photo-btn" title="カメラロールに保存" onclick="saveToCamera('${photo.id}')">💾</button>
          <button class="move-photo-btn" title="タグを変更" onclick="openMoveModal('${photo.id}')">📂</button>
          <button class="delete-photo-btn" title="削除" onclick="deletePhoto('${photo.id}')">🗑</button>
        </div>
      </div>
    `;
    el.appendChild(item);
  });
}

function renderCompare(photos) {
  const strip = document.getElementById('compare-strip');
  strip.innerHTML = '';
  if (photos.length === 0) {
    strip.innerHTML = '<div style="color:var(--text-dim);font-size:14px;padding:20px;">写真がありません。</div>';
    return;
  }
  // Show newest first
  const sorted = [...photos].sort((a,b) => new Date(b.date) - new Date(a.date));
  sorted.forEach(photo => {
    const card = document.createElement('div');
    card.className = 'compare-card';
    card.innerHTML = `
      <img src="${photo.dataUrl}" alt="">
      <div class="compare-card-date">${formatDate(photo.date)}</div>
    `;
    strip.appendChild(card);
  });
}

function deletePhoto(photoId) {
  document.getElementById('modal-del-photo-confirm').onclick = () => executeDeletePhoto(photoId);
  document.getElementById('modal-delete-photo').classList.add('open');
}

function executeDeletePhoto(photoId) {
  const tagId = state.currentAlbum;
  state.photos[tagId] = (state.photos[tagId] || []).filter(p => p.id !== photoId);
  save();
  closeModal('modal-delete-photo');
  document.getElementById('viewer-photo-count').textContent = `${state.photos[tagId].length}枚`;
  setView(state.currentView);
  showToast('🗑 写真を削除しました');
}

// ── Utils ──
function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateFull(iso) {
  const d = new Date(iso);
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Sort mode ──
function enterSortMode(tagId) {
  _sortMode = true;
  _sortActiveId = tagId;
  renderTagGrid();
  showToast('↕ 並び替えモード：タグをタップして ↑↓ で移動');
}

function exitSortMode() {
  _sortMode = false;
  _sortActiveId = null;
  renderTagGrid();
}

function selectSortTag(tagId) {
  _sortActiveId = tagId;
  renderTagGrid();
}

function sortMove(dir) {
  const tags = state.tags.filter(t => t.id !== UNTAGGED_ID);
  const untagged = state.tags.filter(t => t.id === UNTAGGED_ID);
  const idx = tags.findIndex(t => t.id === _sortActiveId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= tags.length) return;
  const [moved] = tags.splice(idx, 1);
  tags.splice(newIdx, 0, moved);
  state.tags = [...tags, ...untagged];
  save();
  renderTagGrid();
}

function updateSortButtons() {
  const tags = state.tags.filter(t => t.id !== UNTAGGED_ID);
  const idx = tags.findIndex(t => t.id === _sortActiveId);
  document.getElementById('sort-up-btn').disabled   = (idx <= 0);
  document.getElementById('sort-down-btn').disabled = (idx < 0 || idx >= tags.length - 1);
}

// ── Edit tag name ──
let _editTagId = null;

function openEditTag(tagId) {
  _editTagId = tagId;
  const tag = state.tags.find(t => t.id === tagId);
  const input = document.getElementById('edit-tag-input');
  input.value = tag.name;
  document.getElementById('modal-edit-confirm').onclick = executeEditTag;
  document.getElementById('modal-edit-tag').classList.add('open');
  setTimeout(() => { input.focus(); input.select(); }, 80);
}

function executeEditTag() {
  const input = document.getElementById('edit-tag-input');
  const newName = input.value.trim();
  if (!newName) return;
  if (state.tags.find(t => t.name === newName && t.id !== _editTagId)) {
    input.style.borderColor = 'var(--red)';
    setTimeout(() => input.style.borderColor = '', 800);
    return;
  }
  const tag = state.tags.find(t => t.id === _editTagId);
  tag.name = newName;
  save();
  closeModal('modal-edit-tag');
  renderTagGrid();
  showToast('✏️ タグ名を変更しました');
}

// ── Modal helpers ──
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// ── Tag deletion ──
function confirmDeleteTag(ev, tagId) {
  ev.stopPropagation();
  const tag = state.tags.find(t => t.id === tagId);
  const count = (state.photos[tagId] || []).length;
  const body = count > 0
    ? `「<strong>${tag.name}</strong>」を削除します。<br>このタグの <strong>${count}枚の写真</strong> は「タグなし」アルバムに移動されます。`
    : `「<strong>${tag.name}</strong>」を削除します。`;
  document.getElementById('modal-del-body').innerHTML = body;
  document.getElementById('modal-del-confirm').onclick = () => executeDeleteTag(tagId);
  document.getElementById('modal-delete-tag').classList.add('open');
}

function executeDeleteTag(tagId) {
  const photos = state.photos[tagId] || [];
  if (photos.length > 0) {
    if (!state.photos[UNTAGGED_ID]) state.photos[UNTAGGED_ID] = [];
    state.photos[UNTAGGED_ID].unshift(...photos);
    // ensure untagged pseudo-tag exists in tags list
    if (!state.tags.find(t => t.id === UNTAGGED_ID)) {
      state.tags.push({ id: UNTAGGED_ID, name: 'タグなし', color: '#7B82A8' });
    }
  }
  state.tags = state.tags.filter(t => t.id !== tagId);
  delete state.photos[tagId];
  if (state.selectedTag === tagId) state.selectedTag = null;
  save();
  closeModal('modal-delete-tag');
  renderTagGrid();
  showToast('🗑 タグを削除しました');
}

// ── Move photo ──
let _movePhotoId = null;

function openMoveModal(photoId) {
  _movePhotoId = photoId;
  const list = document.getElementById('move-tag-list');
  list.innerHTML = '';
  state.tags.filter(t => t.id !== state.currentAlbum).forEach(tag => {
    const opt = document.createElement('div');
    opt.className = 'move-tag-option';
    opt.innerHTML = `<span class="dot" style="background:${tag.color}"></span>${tag.name}`;
    opt.onclick = () => executeMove(tag.id);
    list.appendChild(opt);
  });
  if (!list.children.length) {
    list.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px 0">他のタグがありません。</div>';
  }
  document.getElementById('modal-move-photo').classList.add('open');
}

function executeMove(destTagId) {
  const srcTagId = state.currentAlbum;
  const photo = (state.photos[srcTagId] || []).find(p => p.id === _movePhotoId);
  if (!photo) return;
  state.photos[srcTagId] = state.photos[srcTagId].filter(p => p.id !== _movePhotoId);
  if (!state.photos[destTagId]) state.photos[destTagId] = [];
  state.photos[destTagId].unshift(photo);
  save();
  closeModal('modal-move-photo');
  const destTag = state.tags.find(t => t.id === destTagId);
  showToast(`📂 「${destTag.name}」に移動しました`);
  const photos = state.photos[srcTagId];
  document.getElementById('viewer-photo-count').textContent = `${photos.length}枚`;
  setView(state.currentView);
}

// ── Save to camera roll ──
function saveToCamera(photoId) {
  const tagId = state.currentAlbum;
  const photo = (state.photos[tagId] || []).find(p => p.id === photoId);
  if (!photo) return;
  const a = document.createElement('a');
  a.href = photo.dataUrl;
  a.download = `tagrudesu_${photoId}.jpg`;
  a.click();
  showToast('💾 カメラロールに保存しました');
}

// ── Init ──
checkLocalStorage();
load();
renderTagGrid();

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', (e) => { if (e.target === el) el.classList.remove('open'); });
});

// Enter to confirm edit
document.getElementById('edit-tag-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') executeEditTag();
});
</script>

  </button>
</footer>
